appId: highlighttext.example
---
- launchApp:
    clearState: true
    stopApp: true
- extendedWaitUntil:
    visible: "S1: align"
    timeout: 60000
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s1_align
# Freshly mounted isEditable={false} views (S1 is the first screen, nothing to recycle):
# typing must not change them. s1_align_typed must be pixel-identical to s1_align.
- tapOn:
    text: "The quick brown fox jumps over the lazy dog"
    index: 0
- inputText: "zz"
- assertNotVisible: ".*zz.*"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s1_align_typed
- tapOn: "Next"
- assertVisible: "S2: align2"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s2_align2
- tapOn: "Next"
- assertVisible: "S3: vertical"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s3_vertical
- tapOn: "Next"
- assertVisible: "S4: styles"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s4_styles
- tapOn: "Next"
- assertVisible: "S5: spacing"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s5_spacing
# --- S6 editable: typing, deleting, programmatic set, clear
- tapOn: "Next"
- assertVisible: "S6: editable"
- assertVisible: "len=7 text=.Edit me."
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s6_editable_initial
- tapOn:
    id: "input"
- inputText: " ok"
- extendedWaitUntil:
    visible: "len=10 text=.Edit me ok."
    timeout: 5000
- eraseText: 3
- extendedWaitUntil:
    visible: "len=7 text=.Edit me."
    timeout: 5000
- tapOn: "Set text"
- extendedWaitUntil:
    visible: "len=12 text=.Programmatic."
    timeout: 5000
- inputText: "X"
- extendedWaitUntil:
    visible: "len=13 text=.ProgrammaticX."
    timeout: 5000
- tapOn: "Clear"
- extendedWaitUntil:
    visible: "len=0 text=.."
    timeout: 5000
- inputText: "New"
- extendedWaitUntil:
    visible: "len=3 text=.New."
    timeout: 5000
- tapOn: "Set text"
- assertVisible: "len=12 text=.Programmatic."
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s6_editable_after
# --- S7 read-only: typing must not change the text
- tapOn: "Next"
- assertVisible: "S7: readonly"
- tapOn:
    id: "input"
- inputText: "zz"
- assertVisible: "len=7 text=.Edit me."
- tapOn: "Set text"
- assertVisible: "len=12 text=.Programmatic."
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s7_readonly
# --- S8 autoFocus: keyboard should open by itself, typing works without tapping
- tapOn: "Next"
- assertVisible: "S8: autofocus"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s8_autofocus
# --- S9 api (Phase 2b): placeholder, focus/blur/submit/selection events,
# ref commands, maxLength, editable alias, runtime font change.
- tapOn: "Next"
- assertVisible: "S9: api"
# The iOS placeholder label is not in the accessibility tree; the screenshot covers it there
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Type here"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s9_placeholder
# ref.focus() -> onFocus; editable={true} wins over isEditable={false}
- tapOn: "Focus"
- extendedWaitUntil:
    visible: "focus=1"
    timeout: 5000
- inputText: "hello"
- extendedWaitUntil:
    visible: "s9 len=5 text=.hello."
    timeout: 5000
- assertVisible: "sel=5-5"
# returnKeyType="done": Return fires onSubmitEditing and inserts no new line
- pressKey: Enter
- extendedWaitUntil:
    visible: "submit=.hello."
    timeout: 5000
- assertVisible: "s9 len=5 text=.hello."
# ref.blur() -> onBlur
- tapOn: "Blur"
- extendedWaitUntil:
    visible: "blur=1"
    timeout: 5000
# ref.setText() / ref.clear() fire onChange
- tapOn: "Set"
- extendedWaitUntil:
    visible: "s9 len=8 text=.Ref text."
    timeout: 5000
- tapOn: "Clear"
- extendedWaitUntil:
    visible: "s9 len=0 text=.."
    timeout: 5000
# The iOS placeholder label is not in the accessibility tree; the screenshot covers it there
- runFlow:
    when:
      platform: Android
    commands:
      - assertVisible: "Type here"
# maxLength={12}: typing stops at 12 characters
- tapOn: "Focus"
- extendedWaitUntil:
    visible: "focus=2"
    timeout: 5000
- inputText: "abcdefghijklmnop"
- extendedWaitUntil:
    visible: "s9 len=12 text=.abcdefghijkl."
    timeout: 5000
- assertVisible: "sel=12-12"
- tapOn: "Blur"
- extendedWaitUntil:
    visible: "blur=2"
    timeout: 5000
# Runtime font change (serif, 34) must look like a fresh mount with that font
- tapOn: "Set"
- extendedWaitUntil:
    visible: "s9 len=8 text=.Ref text."
    timeout: 5000
- tapOn: "Font"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s9_font_changed
- tapOn: "Remount"
- waitForAnimationToEnd
- takeScreenshot: ${OUT}/s9_font_remounted
